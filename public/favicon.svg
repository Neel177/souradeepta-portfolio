<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">

  <defs>

    <!-- Main neon gradient -->
    <linearGradient
      id="neon"
      x1="8"
      y1="8"
      x2="56"
      y2="56"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="0.28" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="0.8" stop-color="#14E5C5"/>
      <stop offset="1" stop-color="#22F06B"/>
    </linearGradient>

    <!-- Dark glass interior -->
    <radialGradient
      id="inside"
      cx="32"
      cy="22"
      r="40"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#20243B"/>
      <stop offset="0.55" stop-color="#0E1424"/>
      <stop offset="1" stop-color="#05070D"/>
    </radialGradient>

    <!-- Soft glow -->
    <filter
      id="glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger S glow -->
    <filter
      id="sGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- Dark rounded favicon background -->
  <rect
    x="1"
    y="1"
    width="62"
    height="62"
    rx="19"
    fill="#05070D"
  />


  <!-- Very subtle inner color -->
  <circle
    cx="32"
    cy="32"
    r="27"
    fill="url(#inside)"
  />


  <!-- Outer neon glow -->
  <circle
    cx="32"
    cy="32"
    r="27"
    stroke="url(#neon)"
    stroke-width="5"
    opacity="0.35"
    filter="url(#glow)"
  />


  <!-- Main neon ring -->
  <circle
    cx="32"
    cy="32"
    r="27"
    stroke="url(#neon)"
    stroke-width="3.2"
  />


  <!-- Subtle inner highlight -->
  <circle
    cx="32"
    cy="32"
    r="24.8"
    stroke="url(#neon)"
    stroke-width="0.7"
    opacity="0.35"
  />


  <!-- Main S glow -->
  <path
    d="
      M 43 21
      C 40.5 17
        36.5 15
        31 15

      C 23.5 15
        18 18.8
        18 24.5

      C 18 30
        21.8 33
        28.8 35

      L 35.2 36.8

      C 39.5 38
        41.5 40.3
        41.5 43.2

      C 41.5 47.2
        37.5 49
        31.5 49

      C 25.5 49
        21.5 46.8
        19.5 43
    "
    stroke="url(#neon)"
    stroke-width="5.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#sGlow)"
  />


  <!-- Small signature dot -->
  <circle
    cx="45"
    cy="17"
    r="3.2"
    fill="url(#neon)"
    filter="url(#sGlow)"
  />

  <!-- Tiny highlight on dot -->
  <circle
    cx="44"
    cy="16"
    r="0.8"
    fill="white"
    opacity="0.75"
  />

</svg>